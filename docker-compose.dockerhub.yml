services:
  mongo:
    image: mongo:7
    container_name: fatec_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fatec_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: bielfranca/sistema-fatec-backend:latest
    container_name: fatec_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=ponto_fatec
      - ADMIN_EMAIL=${ADMIN_EMAIL:-gabrielpedra1999@gmail.com}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-fatec.sp.gov.br,cps.sp.gov.br}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APP_SECRET=${APP_SECRET:-fatec-ponto-academico-local-secret}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - ALLOW_LOCAL_DEMO_LOGIN=${ALLOW_LOCAL_DEMO_LOGIN:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-organizations}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:3000/api/auth/microsoft/callback}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fatec_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15

  frontend:
    image: bielfranca/sistema-fatec-frontend:latest
    container_name: fatec_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fatec_net

networks:
  fatec_net:
    driver: bridge

volumes:
  mongo_data:
